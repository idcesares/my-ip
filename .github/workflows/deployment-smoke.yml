name: Deployment smoke

# Verifies the live site after Vercel reports a successful Production deploy.
# GitHub only runs deployment_status workflows from the default branch.
#
# Vercel's environment_url is the deployment-specific *.vercel.app address,
# which sits behind Deployment Protection, so by default this checks the public
# production domain (override with the PRODUCTION_URL repository variable).
# Right after a deploy the domain can still be serving the previous build for a
# moment. To test the exact deployment instead, add the repository secret
# VERCEL_AUTOMATION_BYPASS_SECRET (Protection Bypass for Automation); the
# deployment URL is then used. Previews are not checked here.

on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != '' &&
      startsWith(github.event.deployment_status.environment, 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Verify the deployment
        run: node scripts/deployment-smoke.mjs
        env:
          DEPLOY_URL: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' && github.event.deployment_status.environment_url || vars.PRODUCTION_URL || 'https://myip.dcesares.dev' }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
